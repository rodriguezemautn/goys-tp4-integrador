---
# Mismo orden que prueba-ram/desplegar-replica.sh
- name: Desplegar servicios en el clúster
  hosts: servers
  become: true
  gather_facts: false
  vars:
    deploy_apply_code: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/apply_checked.py') }}"
    deploy_apply_argv: ["python3", "-c", "{{ deploy_apply_code }}"]
    deploy_k8s: "{{ playbook_dir }}/../k8s"
  tasks:
    - name: Cortar si siguen los valores de ejemplo
      ansible.builtin.assert:
        that:
          - "'CAMBIAR' not in (bgp_md5 if item == 'metallb' else grafana_admin)"
        fail_msg: "Falta vault.yml o tiene los valores de ejemplo"
      loop:
        - metallb
        - monitoring
      when: "'all' in ansible_run_tags or item in ansible_run_tags"
      tags:
        - always

    - name: Aplicar MetalLB
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-f', deploy_k8s ~ '/metallb/metallb-native.yaml'] }}"
      register: deploy_metallb
      changed_when: deploy_metallb.stdout | trim == 'changed'
      tags:
        - metallb

    - name: Esperar al controller de MetalLB (webhook)
      ansible.builtin.command: k3s kubectl -n metallb-system rollout status deployment/controller --timeout=300s
      changed_when: false
      tags:
        - metallb

    - name: Crear el Secret de la clave BGP
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-f', '-'] }}"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'kubernetes.io/basic-auth',
              'metadata': {'name': 'bgp-md5', 'namespace': 'metallb-system'},
              'stringData': {'password': bgp_md5}} | to_json }}
      register: deploy_secreto_bgp
      changed_when: deploy_secreto_bgp.stdout | trim == 'changed'
      no_log: true
      tags:
        - metallb

    - name: Aplicar pool y sesión BGP (reintenta hasta que el webhook responda)
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-f', deploy_k8s ~ '/metallb/bgp.yaml'] }}"
      register: deploy_bgp
      changed_when: deploy_bgp.stdout | trim == 'changed'
      retries: 12
      delay: 10
      until: deploy_bgp is succeeded
      tags:
        - metallb

    - name: Aplicar la aplicación
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-k', deploy_k8s ~ '/app'] }}"
      register: deploy_app
      changed_when: deploy_app.stdout | trim == 'changed'
      tags:
        - app

    - name: Crear el namespace de monitoreo
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-f', deploy_k8s ~ '/monitoring/namespace.yaml'] }}"
      register: deploy_ns
      changed_when: deploy_ns.stdout | trim == 'changed'
      tags:
        - monitoring

    - name: Crear el Secret de Grafana
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-f', '-'] }}"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
              'metadata': {'name': 'grafana-admin', 'namespace': 'monitoring'},
              'stringData': {'password': grafana_admin}} | to_json }}
      register: deploy_secreto_grafana
      changed_when: deploy_secreto_grafana.stdout | trim == 'changed'
      no_log: true
      tags:
        - monitoring

    - name: Aplicar monitoreo
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-k', deploy_k8s ~ '/monitoring'] }}"
      register: deploy_monitoreo
      changed_when: deploy_monitoreo.stdout | trim == 'changed'
      tags:
        - monitoring

    - name: Aplicar NetworkPolicies
      ansible.builtin.command:
        argv: "{{ deploy_apply_argv + ['-k', deploy_k8s ~ '/netpol'] }}"
      register: deploy_netpol
      changed_when: deploy_netpol.stdout | trim == 'changed'
      tags:
        - netpol

    - name: Esperar a los Deployments
      ansible.builtin.command: k3s kubectl -n {{ item.ns }} rollout status deployment/{{ item.nombre }} --timeout=300s
      loop:
        - {ns: web, nombre: frontend, componente: app}
        - {ns: datos, nombre: backend, componente: app}
        - {ns: monitoring, nombre: prometheus, componente: monitoring}
        - {ns: monitoring, nombre: grafana, componente: monitoring}
      loop_control:
        label: "{{ item.ns }}/{{ item.nombre }}"
      when: "'all' in ansible_run_tags or item.componente in ansible_run_tags"
      changed_when: false
      tags:
        - app
        - monitoring
