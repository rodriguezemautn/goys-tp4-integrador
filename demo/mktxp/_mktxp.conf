[MKTXP]
    listen = '0.0.0.0:49090'
    socket_timeout = 2

    initial_delay_on_failure = 10
    max_delay_on_failure = 30
    delay_inc_div = 5

    bandwidth = False
    minimal_collect_interval = 5

    verbose_mode = False

    fetch_routers_in_parallel = True    # 5 routers en menos de los 5 s del scrape
    max_worker_threads = 5
    max_scrape_duration = 4
    total_max_scrape_duration = 4

    persistent_router_connection_pool = True
    persistent_dhcp_cache = True
    compact_default_conf_values = False
    prometheus_headers_deduplication = False
