apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: monitoring}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 10s
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: tp4
        type: file
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: monitoring, labels: {app: grafana}}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      # Fijado al server: en la demo se apaga un agent y el gráfico tiene que seguir.
      nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.5
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/tp4.json}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 5}
          resources: {requests: {cpu: 50m, memory: 192Mi}, limits: {memory: 384Mi}}
          volumeMounts:
            - {name: datos, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: datos
          emptyDir: {}
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: monitoring}
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http, nodePort: 30300}
