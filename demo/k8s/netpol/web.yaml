apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: denegar-ingreso, namespace: web}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-80, namespace: web}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 80}
