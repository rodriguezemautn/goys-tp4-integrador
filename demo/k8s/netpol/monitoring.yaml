apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: denegar-ingreso, namespace: monitoring}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-3000, namespace: monitoring}
spec:
  podSelector: {matchLabels: {app: grafana}}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-desde-grafana, namespace: monitoring}
spec:
  podSelector: {matchLabels: {app: prometheus}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: grafana}}
      ports:
        - {protocol: TCP, port: 9090}
