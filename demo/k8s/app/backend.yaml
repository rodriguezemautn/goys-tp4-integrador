apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: datos, labels: {app: backend}}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          readinessProbe: {httpGet: {path: /health, port: 80}, periodSeconds: 5}
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: datos}
spec:
  type: ClusterIP
  selector: {app: backend}
  ports:
    - {name: http, port: 80, targetPort: http}
