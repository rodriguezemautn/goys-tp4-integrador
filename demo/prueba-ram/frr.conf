! Reemplaza al CHR en la réplica con contenedores. Misma lógica que routeros/chr-borde.rsc.
! replica-docker.sh reemplaza CAMBIAR-CLAVE-BGP y deja la copia en .frr/ (fuera de git).
frr defaults traditional
hostname chr-replica
log stdout
ip forwarding
!
ip prefix-list SERVICIOS seq 10 permit 10.10.20.0/28 ge 32 le 32
!
route-map K3S-IN permit 10
 match ip address prefix-list SERVICIOS
exit
route-map K3S-IN deny 20
exit
route-map K3S-OUT deny 10
exit
!
router bgp 65000
 bgp router-id 10.10.10.1
 neighbor K3S peer-group
 neighbor K3S remote-as 64512
 neighbor K3S password CAMBIAR-CLAVE-BGP
 neighbor K3S timers 3 9
 neighbor 10.10.10.11 peer-group K3S
 neighbor 10.10.10.12 peer-group K3S
 neighbor 10.10.10.13 peer-group K3S
 address-family ipv4 unicast
  neighbor K3S route-map K3S-IN in
  neighbor K3S route-map K3S-OUT out
  maximum-paths 3
 exit-address-family
exit
