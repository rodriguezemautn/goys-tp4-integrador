<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Topología de la estación QEMU — TP4 Grupo 4</title>
  <desc>Un MikroTik CHR emulado y tres nodos k3s Ubuntu ARM64 unidos por un hub de QEMU dentro de la Mac de la estación, con eBGP entre el CHR (AS 65000) y MetalLB (AS 64512).</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>

  <!-- Mac -->
  <rect x="20" y="20" width="1160" height="550" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="40" y="50" font-size="20" font-weight="bold" fill="#0f172a">Mac ARM64 (estación de R1)</text>
  <text x="40" y="72" font-size="13" fill="#334155">QEMU · todas las conexiones entre VMs son sockets en 127.0.0.1: el laboratorio no sale de la Mac</text>

  <!-- CHR -->
  <rect x="50" y="110" width="330" height="300" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="70" y="140" font-size="18" font-weight="bold" fill="#7c2d12">MikroTik CHR (RouterOS v7)</text>
  <text x="70" y="164" font-size="13" fill="#431407">qemu-system-x86_64 emulado (TCG)</text>
  <text x="70" y="182" font-size="13" fill="#431407">1 vCPU · 1 GB · -no-reboot</text>
  <text x="70" y="212" font-size="15" font-weight="bold" fill="#7c2d12">AS 65000 · router-id 10.10.10.1</text>
  <text x="70" y="238" font-size="13" fill="#431407">Filtro de entrada: solo /32 de 10.10.20.0/28</text>
  <text x="70" y="256" font-size="13" fill="#431407">Filtro de salida: no anuncia nada</text>
  <text x="70" y="274" font-size="13" fill="#431407">Consola: serial en la terminal de la Mac</text>
  <!-- ether2 -->
  <rect x="226" y="300" width="154" height="56" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="238" y="322" font-size="13" font-weight="bold" fill="#7c2d12">ether2 "cluster"</text>
  <text x="238" y="342" font-size="13" fill="#431407">10.10.10.1/24</text>
  <!-- ether1 -->
  <rect x="50" y="300" width="150" height="56" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-dasharray="5 4"/>
  <text x="62" y="322" font-size="13" font-weight="bold" fill="#7c2d12">ether1 "clients"</text>
  <text x="62" y="342" font-size="12" fill="#431407">IP: sin confirmar</text>
  <!-- hub 1 vacío -->
  <line x1="125" y1="356" x2="125" y2="460" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="45" y="460" width="160" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="58" y="484" font-size="13" fill="#334155">hub 1 de QEMU</text>
  <text x="58" y="503" font-size="12" fill="#334155">sin otros puertos:</text>
  <text x="58" y="518" font-size="12" fill="#334155">sin camino a la Mac</text>

  <!-- Hub auxiliar -->
  <rect x="460" y="250" width="250" height="160" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="478" y="280" font-size="17" font-weight="bold" fill="#312e81">Helper QEMU</text>
  <text x="478" y="300" font-size="13" fill="#1e1b4b">proceso sin disco</text>
  <text x="478" y="324" font-size="13" fill="#1e1b4b">hub 0: repite cada trama</text>
  <text x="478" y="342" font-size="13" fill="#1e1b4b">a todos sus puertos</text>
  <text x="478" y="372" font-size="12" fill="#1e1b4b">→ CHR: 127.0.0.1:41001</text>
  <text x="478" y="390" font-size="12" fill="#1e1b4b">← nodos: :41011 · :41012 · :41013</text>
  <line x1="380" y1="328" x2="460" y2="328" stroke="#4338ca" stroke-width="3"/>
  <text x="388" y="318" font-size="11" fill="#312e81">socket</text>

  <!-- Nodos -->
  <g font-size="13">
    <rect x="790" y="110" width="360" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="810" y="138" font-size="17" font-weight="bold" fill="#064e3b">k3s-server · 10.10.10.11</text>
    <text x="810" y="160" fill="#022c22">Ubuntu ARM64 (HVF) · 2 vCPU · 2 GB</text>
    <text x="810" y="180" fill="#022c22">Plano de control k3s + MetalLB speaker</text>
    <text x="810" y="200" fill="#022c22">AS 64512 · BGP con el CHR</text>
    <text x="810" y="222" fill="#475569">Gestión: NAT de QEMU, SSH 127.0.0.1:2223</text>

    <rect x="790" y="265" width="360" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="810" y="293" font-size="17" font-weight="bold" fill="#064e3b">k3s-agent1 · 10.10.10.12</text>
    <text x="810" y="315" fill="#022c22">Ubuntu ARM64 (HVF) · 1 vCPU · 768 MB</text>
    <text x="810" y="335" fill="#022c22">Worker + MetalLB speaker</text>
    <text x="810" y="355" fill="#022c22">AS 64512 · BGP con el CHR</text>
    <text x="810" y="377" fill="#475569">Gestión: NAT de QEMU, SSH 127.0.0.1:2224</text>

    <rect x="790" y="420" width="360" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="810" y="448" font-size="17" font-weight="bold" fill="#064e3b">k3s-agent2 · 10.10.10.13</text>
    <text x="810" y="470" fill="#022c22">Ubuntu ARM64 (HVF) · 1 vCPU · 768 MB</text>
    <text x="810" y="490" fill="#022c22">Worker + MetalLB speaker</text>
    <text x="810" y="510" fill="#022c22">AS 64512 · BGP con el CHR</text>
    <text x="810" y="532" fill="#475569">Gestión: NAT de QEMU, SSH 127.0.0.1:2225</text>
  </g>
  <g stroke="#4338ca" stroke-width="3" fill="none">
    <path d="M710 300 C 750 300, 750 175, 790 175"/>
    <path d="M710 330 L 790 330"/>
    <path d="M710 360 C 750 360, 750 485, 790 485"/>
  </g>
  <text x="478" y="432" font-size="12" fill="#312e81">LAN del clúster 10.10.10.0/24</text>

  <!-- BGP -->
  <g stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#flecha)">
    <path d="M790 125 C 640 70, 450 70, 335 108"/>
  </g>
  <text x="420" y="122" font-size="13" font-weight="bold" fill="#1d4ed8">los 3 nodos anuncian 10.10.20.10/32 (frontend)</text>

  <!-- Leyenda -->
  <rect x="20" y="585" width="1160" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="613" font-size="15" font-weight="bold" fill="#0f172a">BGP</text>
  <text x="40" y="635" font-size="13" fill="#1e293b">eBGP CHR (AS 65000) ↔ MetalLB (AS 64512) · 3 sesiones, una por nodo · TCP-MD5 · hold time 9 s, keepalive 3 s</text>
  <text x="40" y="655" font-size="13" fill="#1e293b">Pool de servicios MetalLB: 10.10.20.0/28, anunciado como /32 · el frontend usa 10.10.20.10</text>
  <text x="40" y="675" font-size="13" fill="#1e293b">Si cae un nodo: el hold time vence en hasta 9 s, el CHR cierra esa sesión y retira esa ruta; quedan las de los otros dos</text>
  <text x="40" y="695" font-size="12" fill="#475569">Armado desde station.py, prepare_ubuntu.py y chr-bgp-qemu-r1.public.rsc. No se pudo confirmar en la estación el 15/11 (ver 2.1).</text>
</svg>
