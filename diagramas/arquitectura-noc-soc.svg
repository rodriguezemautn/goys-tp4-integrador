<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 560" width="936" height="560" font-family="Arial, Liberation Sans, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f2942"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="936" height="560" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Título interno -->
  <text x="468" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Arquitectura y Topología de Red — Plataforma Integrada NOC/SOC (br-monitored)</text>

  <!-- Zona 1: Clientes / Atacante -->
  <rect x="30" y="46" width="380" height="78" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="220" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Nodo Atacante (demo_attacker)</text>
  <text x="220" y="87" text-anchor="middle" font-size="12" fill="#7f1d1d">IP: 172.28.0.99 · Alpine + cURL</text>
  <text x="220" y="106" text-anchor="middle" font-size="11" fill="#b91c1c">SQLi / Escáner (sqlmap) / Path Traversal / SYN Flood</text>

  <rect x="510" y="46" width="380" height="78" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="700" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Clientes Legítimos (Host / Red Externa)</text>
  <text x="700" y="87" text-anchor="middle" font-size="12" fill="#14532d">Acceso vía Host :8080 -> 172.28.0.10:80</text>
  <text x="700" y="106" text-anchor="middle" font-size="11" fill="#15803d">Tráfico HTTP normal (200 OK continuo)</text>

  <!-- Flechas hacia el Bridge -->
  <line x1="220" y1="124" x2="220" y2="162" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="230" y="148" font-size="10.5" fill="#b91c1c">Tráfico HTTP malicioso</text>

  <line x1="700" y1="124" x2="700" y2="162" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="545" y="148" font-size="10.5" fill="#15803d">Tráfico HTTP legítimo</text>

  <!-- Zona 2: Bridge Virtual Kernel -->
  <rect x="30" y="166" width="860" height="64" rx="6" fill="#0f2942" stroke="#0284c7" stroke-width="2"/>
  <text x="460" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Kernel Linux Host — Bridge Virtual: br-monitored (172.28.0.0/16 · GW 172.28.0.1)</text>
  <text x="460" y="213" text-anchor="middle" font-size="12" fill="#93c5fd">Filtrado Dinámico L3/L4: iptables cadenas FORWARD y DOCKER-USER (DROP por IP de origen)</text>

  <!-- Flechas desde Bridge hacia Víctima y Suricata -->
  <line x1="220" y1="230" x2="220" y2="274" stroke="#0f2942" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="230" y="256" font-size="10.5" fill="#334155">Tráfico filtrado (HTTP TCP/80)</text>

  <line x1="700" y1="230" x2="700" y2="274" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="530" y="256" font-size="10.5" fill="#0369a1">Inspección promiscua (AF_PACKET)</text>

  <!-- Zona 3: Servidor Víctima y Sensor IDS -->
  <rect x="30" y="278" width="380" height="82" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Servidor Víctima (web_target)</text>
  <text x="220" y="322" text-anchor="middle" font-size="12" fill="#0284c7" font-weight="bold">Nginx Alpine · 172.28.0.10:80 (Host :8080)</text>
  <text x="220" y="342" text-anchor="middle" font-size="11" fill="#475569">Portal institucional y endpoints de prueba</text>

  <rect x="510" y="278" width="380" height="82" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="700" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Sensor IDS / SOC (soc_suricata)</text>
  <text x="700" y="322" text-anchor="middle" font-size="12" fill="#0284c7" font-weight="bold">Suricata 8.0 · network_mode: host</text>
  <text x="700" y="342" text-anchor="middle" font-size="11" fill="#475569">Reglas local.rules · Salida JSON en eve.json</text>

  <!-- Flecha de Suricata a Agente -->
  <line x1="700" y1="360" x2="700" y2="404" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="710" y="387" font-size="10.5" fill="#0369a1">Eventos alert (eve.json)</text>

  <!-- Flecha de Agente hacia iptables (feedback loop al kernel) -->
  <path d="M 890 452 L 908 452 L 908 198 L 892 198" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="922" y="325" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626" transform="rotate(-90 922 325)">Regla DROP (iptables)</text>

  <!-- Zona 4: Agente AIOps y Observabilidad NOC -->
  <rect x="510" y="408" width="380" height="122" rx="6" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="700" y="431" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Agente de Respuesta (aiops_agent)</text>
  <text x="700" y="450" text-anchor="middle" font-size="12" fill="#0284c7" font-weight="bold">Python 3.11 · network_mode: host (:8000)</text>
  <text x="700" y="470" text-anchor="middle" font-size="11" fill="#334155">1) Clasificación HTTPS: Groq API (qwen/qwen3.8-27b)</text>
  <text x="700" y="488" text-anchor="middle" font-size="11" fill="#334155">2) Respaldo offline: motor heurístico local</text>
  <text x="700" y="506" text-anchor="middle" font-size="11" fill="#334155">3) Expone /metrics (Prometheus) y /status (JSON)</text>

  <!-- Flecha de Agente a NOC -->
  <line x1="510" y1="469" x2="414" y2="469" stroke="#0f2942" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="462" y="456" text-anchor="middle" font-size="10" fill="#334155">Scrape 2s</text>
  <text x="462" y="485" text-anchor="middle" font-size="10" fill="#334155">HTTP :8000</text>

  <!-- NOC Box -->
  <rect x="30" y="408" width="380" height="122" rx="6" fill="#ffffff" stroke="#0f2942" stroke-width="1.5"/>
  <text x="220" y="431" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">Observabilidad Centralizada (NOC)</text>
  <rect x="48" y="446" width="162" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="129" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Prometheus</text>
  <text x="129" y="485" text-anchor="middle" font-size="10.5" fill="#0284c7">172.28.0.20:9090</text>
  <text x="129" y="502" text-anchor="middle" font-size="10" fill="#475569">Métricas cada 2s</text>

  <line x1="210" y1="480" x2="230" y2="480" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="232" y="446" width="162" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="313" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Grafana OSS</text>
  <text x="313" y="485" text-anchor="middle" font-size="10.5" fill="#0284c7">172.28.0.30:3000</text>
  <text x="313" y="502" text-anchor="middle" font-size="10" fill="#475569">Dashboard NOC/SOC</text>
</svg>
